<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#F7F6F3" />
<meta name="description" content="Miku AI创作平台 — 爆款情报 / 剧本载入与格式转换 / 评估 / 优化，浅色 AI 创作工作台" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23534AB7'/%3E%3Cpath d='M9 23V9m0 7h7m0 7V9m4 14V9' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
<title>Miku AI创作平台 · MIKU AI STUDIO</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="app">

  <!-- ============ 左侧栏 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sf-head">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 19V5m0 7h6m0 7V5m5 14V5"/></svg>
        </div>
        <div class="brand-text">
          <strong>Miku AI创作平台</strong>
          <small>MIKU AI STUDIO</small>
        </div>
      </div>
      <button class="btn-collapse" id="btnCollapse" type="button" aria-label="收起侧栏" title="收起侧栏">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>

    <div class="sf-engine" id="sfEngine">
      <span class="sf-dot" id="sfDot"></span>
      <span id="sfStatus">本地引擎</span>
    </div>

    <nav class="sidebar-nav" id="sidebarNav" aria-label="功能导航"></nav>

    <div class="sf-foot">
      <span class="muted">零依赖 · 离线可用</span>
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <div class="main">
    <header class="topbar">
      <button class="btn-mobile" id="btnMobile" type="button" aria-label="打开导航">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="crumb" id="crumb"></div>
      <div class="topbar-actions">
        <span class="tb-engine" id="tbEngine" title="未接入 AI 模型，生成走本地规则引擎">本地引擎</span>
        <button class="btn btn-sm" id="btnApi" type="button" title="接入大模型 API">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v5"/></svg>
          接 API
        </button>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<!-- API 接入弹窗 -->
<div class="modal-backdrop" id="apiModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="amTitle">
    <div class="modal-head">
      <h2 id="amTitle">接入大模型 API</h2>
      <button class="icon-btn" id="amClose" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="notice notice-info" style="margin-bottom:16px">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 3l9 16H3zM12 10v4M12 17h.01"/></svg>
        <div>Key 只存本机 <span class="mono">data/settings.json</span>，不进浏览器、不上传。接入后<b>规则改写</b>走模型；评估、优化、拆镜始终本地（剧本生成 / 续写已下线）。</div>
      </div>
      <label class="field"><span class="fl">服务商预设</span>
        <select class="editable" id="amPreset"></select></label>
      <div class="form-2" style="margin-top:12px">
        <label class="field"><span class="fl">Base URL</span><input id="amBase" type="text" placeholder="https://api.deepseek.com/v1" /></label>
        <label class="field"><span class="fl">模型名</span><input id="amModel" type="text" placeholder="deepseek-chat" list="amModelList" /><datalist id="amModelList"></datalist></label>
      </div>
      <label class="field" style="margin-top:12px"><span class="fl">API Key</span>
        <input id="amKey" type="password" placeholder="sk-..." autocomplete="off" /></label>
      <label class="field" style="margin-top:12px"><span class="fl">推理等级</span>
        <select class="editable" id="amReasoning">
          <option value="low">Low（推荐：拆镜 / 出稿够用，快且省）</option>
          <option value="off">关闭思考（最快，纯机械输出时选它）</option>
          <option value="high">High（更慢更贵，长文创作可以试）</option>
          <option value="max">Max（最慢最贵，实测拆一集会超时）</option>
          <option value="auto">不指定（服务端默认；DeepSeek 是 High，别家网关请选这项）</option>
        </select></label>
      <div class="muted" style="font-size:10.5px;margin-top:6px;line-height:1.6">思维链和正文共用「最大 Token」，思考越久正文空间越小；思考模式下温度不生效。拆镜 / 大纲这类固定 JSON 输出，High 只会让你多等几分钟。</div>
      <div class="form-3" style="margin-top:12px">
        <label class="field"><span class="fl">温度</span><input id="amTemp" type="number" min="0" max="2" step="0.05" /></label>
        <label class="field"><span class="fl">最大 Token</span><input id="amMax" type="number" min="256" max="128000" step="256" /></label>
        <label class="field"><span class="fl">超时（秒）</span><input id="amTimeout" type="number" min="10" max="600" step="10" /></label>
      </div>
      <label class="field" style="margin-top:12px;display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="amEnabled" style="width:auto" />
        <span style="font-size:12px;font-weight:600">启用（不启用就继续用本地引擎）</span>
      </label>
      <div class="actions" style="margin-top:16px">
        <button class="btn" id="amTest" type="button">测试连接</button>
        <button class="btn" id="amModels" type="button">拉取模型列表</button>
        <span id="amTestResult" class="muted" style="font-size:11px"></span>
      </div>
    </div>
    <div class="modal-foot">
      <span>OpenAI 兼容协议均可：DeepSeek V4.1 Flash / Kimi / 智谱 / 通义 / 硅基流动 / 本地 Ollama</span>
      <button class="btn-primary" id="amSave" type="button">保存并启用</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
